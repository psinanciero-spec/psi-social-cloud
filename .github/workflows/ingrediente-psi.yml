name: Ingrediente Psi - Publicar posteos

on:
  schedule:
    # Horarios en UTC. Argentina = UTC-3 todo el año (sin horario de verano).
    # Todos los posteos apuntan a tarde-noche ARG (19:00-20:00). El script
    # solo publica si el posteo ya venció su publicar_en Y la hora actual
    # ARG esta entre 12:00 y 23:30 -- si Github Actions atrasa la corrida
    # y cae de madrugada, el script la frena sola y espera a la siguiente.
    # Tres chequeos por dia (mediodia + 2 de noche) para que, aunque uno se
    # atrase, otro caiga dentro de la ventana valida.
    - cron: "0 16 * * *"    # 13:00 ARG
    - cron: "0 23 * * *"    # 20:00 ARG
    - cron: "0 1 * * *"     # 22:00 ARG (del dia anterior en UTC)
  workflow_dispatch:

permissions:
  contents: write

# Si dos corridas caen juntas, la segunda espera. Evita publicar el mismo
# posteo dos veces (el bug que paso con Diamond el 02/09/2026).
concurrency:
  group: publicar-ingrediente-psi
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Bajar el codigo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests

      - name: Publicar el posteo que haya vencido, si hay alguno
        env:
          PSI_KREA_TOKEN: ${{ secrets.PSI_KREA_TOKEN }}
        run: python publicar_ingrediente_psi.py

      - name: Guardar la cola actualizada
        run: |
          git config user.name "ingrediente-psi-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && echo "Sin cambios" && exit 0
          git commit -m "Posteo de Ingrediente Psi publicado $(date -u +%Y-%m-%d_%H:%M)"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && break
            echo "Reintento de push ($i)..." && sleep 5
          done
