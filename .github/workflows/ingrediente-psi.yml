name: Ingrediente Psi - Publicar posteos

on:
  schedule:
    # Corre cada hora. Github atrasa los cron varias horas a veces, asi que
    # horarios fijos (ni con respaldo) no alcanzaban -- quedaban cayendo de
    # madrugada y se salteaban enteros. El script decide solo: publica si
    # hay algo vencido, hay cupo, y la hora ARG no es de madrugada.
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Si dos corridas caen juntas, la segunda espera. Evita publicar el mismo
# posteo dos veces (el bug que paso con Diamond el 02/09/2026).
concurrency:
  group: publicar-ingrediente-psi
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Bajar el codigo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests

      - name: Publicar el posteo que haya vencido, si hay alguno
        env:
          PSI_KREA_TOKEN: ${{ secrets.PSI_KREA_TOKEN }}
        run: python publicar_ingrediente_psi.py

      - name: Guardar la cola actualizada
        run: |
          git config user.name "ingrediente-psi-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && echo "Sin cambios" && exit 0
          git commit -m "Posteo de Ingrediente Psi publicado $(date -u +%Y-%m-%d_%H:%M)"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && break
            echo "Reintento de push ($i)..." && sleep 5
          done
