name: Ingrediente Psi - Publicar posteos

on:
  schedule:
    # Horarios en UTC. Argentina = UTC-3 todo el año (sin horario de verano).
    # Dos posteos por dia: uno de tarde (18:00 ARG) y uno de noche (21:00
    # ARG). Cada uno tiene un chequeo de respaldo 1h despues, por si Github
    # Actions atrasa la corrida principal. El script solo publica si el
    # posteo ya vencio su publicar_en Y la hora actual ARG esta entre 12:00
    # y 23:30 -- si cae de madrugada, se frena sola y espera a la siguiente.
    - cron: "0 21 * * *"    # 18:00 ARG (posteo de tarde)
    - cron: "0 22 * * *"    # 19:00 ARG (respaldo de tarde)
    - cron: "0 0 * * *"     # 21:00 ARG (posteo de noche)
    - cron: "0 1 * * *"     # 22:00 ARG (respaldo de noche)
  workflow_dispatch:

permissions:
  contents: write

# Si dos corridas caen juntas, la segunda espera. Evita publicar el mismo
# posteo dos veces (el bug que paso con Diamond el 02/09/2026).
concurrency:
  group: publicar-ingrediente-psi
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Bajar el codigo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests

      - name: Publicar el posteo que haya vencido, si hay alguno
        env:
          PSI_KREA_TOKEN: ${{ secrets.PSI_KREA_TOKEN }}
        run: python publicar_ingrediente_psi.py

      - name: Guardar la cola actualizada
        run: |
          git config user.name "ingrediente-psi-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && echo "Sin cambios" && exit 0
          git commit -m "Posteo de Ingrediente Psi publicado $(date -u +%Y-%m-%d_%H:%M)"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && break
            echo "Reintento de push ($i)..." && sleep 5
          done
