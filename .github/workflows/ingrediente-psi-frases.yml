name: Ingrediente Psi - Publicar frases

on:
  schedule:
    - cron: "0 11 * * *"    # 08:00 ARG
    - cron: "30 16 * * *"   # 13:30 ARG
    - cron: "0 1 * * *"     # 22:00 ARG (del dia anterior en UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar-ingrediente-psi-frases
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Bajar el codigo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests

      - name: Publicar la frase que haya vencido, si hay alguna
        env:
          PSI_KREA_TOKEN: ${{ secrets.PSI_KREA_TOKEN }}
        run: python publicar_frases_ingrediente_psi.py

      - name: Guardar la cola actualizada
        run: |
          git config user.name "ingrediente-psi-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && echo "Sin cambios" && exit 0
          git commit -m "Frase de Ingrediente Psi publicada $(date -u +%Y-%m-%d_%H:%M)"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && break
            echo "Reintento de push ($i)..." && sleep 5
          done
