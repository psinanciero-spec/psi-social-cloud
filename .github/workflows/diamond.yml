name: Diamond Cleaning - Publicar Reels

on:
  schedule:
    # Horarios en UTC. Gold Coast (Queensland) = UTC+10 todo el año: no tiene horario de verano.
    # Repartidos, nunca en rafaga: en junio de 2026 restringieron la cuenta de
    # Facebook por subir varios seguidos.
    # Ocho franjas para un cupo diario de 3 a 6: sobran slots a proposito, asi
    # las que se publican no caen siempre en las mismas horas. Cada corrida ademas
    # espera un rato al azar (ver publicar_diamond.py), y decide si le toca
    # publicar segun el cupo del dia.
    - cron: "40 21 * * *"   # 07:40 Gold Coast (del dia siguiente)
    - cron: "10 23 * * *"   # 09:10 Gold Coast
    - cron: "50 0 * * *"    # 10:50 Gold Coast
    - cron: "20 2 * * *"    # 12:20 Gold Coast
    - cron: "5 4 * * *"     # 14:05 Gold Coast
    - cron: "45 5 * * *"    # 15:45 Gold Coast
    - cron: "25 7 * * *"    # 17:25 Gold Coast
    - cron: "10 9 * * *"    # 19:10 Gold Coast
  workflow_dispatch:

permissions:
  contents: write

# Sin esto dos corridas podrian agarrar el mismo video. Es exactamente lo que
# rompia en Windows: cinco tareas juntas publicando lo mismo con el mismo pie.
concurrency:
  group: publicar-diamond
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 70   # incluye la espera al azar de hasta 34 min
    steps:
      - name: Bajar el codigo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests

      - name: Publicar el proximo reel
        env:
          DIAMOND_IG_TOKEN: ${{ secrets.DIAMOND_IG_TOKEN }}
        run: python publicar_diamond.py

      - name: Guardar la cola actualizada
        run: |
          git config user.name "diamond-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && echo "Sin cambios" && exit 0
          git commit -m "Reel de Diamond publicado $(date -u +%Y-%m-%d_%H:%M)"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && break
            echo "Reintento de push ($i)..." && sleep 5
          done
