name: Psi Krea - Publicar Reels

on:
  schedule:
    # Horarios en UTC. Argentina = UTC-3.
    # 12:00 UTC = 09:00 ARG  |  00:00 UTC = 21:00 ARG (del dia anterior)
    - cron: "0 12 * * *"
    - cron: "0 0 * * *"
  workflow_dispatch:   # boton para correrlo a mano

permissions:
  contents: write

# Evita que dos corridas se pisen y publiquen el mismo video
concurrency:
  group: publicar-reel
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Bajar el codigo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests

      - name: Publicar el proximo reel
        env:
          PSI_KREA_TOKEN: ${{ secrets.PSI_KREA_TOKEN }}
        run: python publicar_reel.py

      - name: Guardar la cola actualizada
        run: |
          git config user.name "psi-krea-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && echo "Sin cambios" && exit 0
          git commit -m "Reel publicado $(date -u +%Y-%m-%d_%H:%M)"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && break
            echo "Reintento de push ($i)..." && sleep 5
          done
